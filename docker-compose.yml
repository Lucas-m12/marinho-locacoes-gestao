name: marinho-gestao

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/marinho-gestao
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: marinho-gestao-postgres
    environment:
      POSTGRES_DB: marinho-gestao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - marinho-gestao_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-test:
    image: postgres:18
    container_name: marinho-gestao-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: marinho_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marinho_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3 compatível para os uploads em desenvolvimento e no E2E (Silo, fork mantido do MinIO community).
  # Só para desenvolvimento e teste: produção usa o R2. Console em http://localhost:9001.
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: marinho-gestao-minio
    profiles: ["dev", "test"]
    command: ["silo", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - marinho-gestao_minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  marinho-gestao_postgres_data:
  marinho-gestao_minio_data:
